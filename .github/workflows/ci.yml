name: CI
permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26'

    - name: Install dependencies
      run: make deps

    - name: Lint
      run: make lint

    - name: Lint the install script
      run: shellcheck --shell=sh install.sh

    - name: Test
      run: make test
