name: Dependabot rebase

# Dependabot rebases its pull requests on a merge conflict, but leaves one that is
# merely behind main alone. After every push to main this asks it to rebase any open
# Dependabot pull request that is behind or in conflict, so auto-merge is not stuck on
# a stale branch. Whether Dependabot answers a command posted by this workflow is
# unverified: if it does not, comment "@dependabot rebase" by hand.
on:
  push:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Dependabot to rebase stale pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --author "app/dependabot" --state open \
            --json number,mergeStateStatus \
            --jq '.[] | select(.mergeStateStatus == "BEHIND" or .mergeStateStatus == "DIRTY") | .number' |
            while read -r number; do
              gh pr comment "$number" --body "@dependabot rebase"
            done
